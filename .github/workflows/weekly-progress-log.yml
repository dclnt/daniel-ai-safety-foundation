name: Weekly Progress Log

# Phase 1 of the weekly journal pipeline. Every Thursday, pull the prior Thu->Wed
# study window from MasteryMaven (Supabase) and open a draft PR with the facts JSON.
# Daniel then runs /journal-logger locally to draft the voiced entry, reviews, merges.

on:
  schedule:
    - cron: '0 8 * * 4' # Thursday 08:00 UTC (early Thursday in America/Edmonton)
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Override window start (YYYY-MM-DD, local time). Use with end_date for re-runs.'
        required: false
      end_date:
        description: 'Override window end (YYYY-MM-DD, local time).'
        required: false

permissions:
  contents: write # create the weekly-log branch and commit the facts JSON
  pull-requests: write # open the draft PR

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TIMEZONE: America/Edmonton
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      USER_ID: ${{ secrets.USER_ID }}
      START_DATE: ${{ github.event.inputs.start_date }}
      END_DATE: ${{ github.event.inputs.end_date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Extract weekly facts
        id: extract
        run: npx tsx scripts/extract-weekly-progress.ts

      - name: Commit facts and open draft PR (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LABEL="${{ steps.extract.outputs.week_label }}"
          BRANCH="${{ steps.extract.outputs.branch }}"
          FACTS="${{ steps.extract.outputs.facts_file }}"

          git config user.name "weekly-log-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-run safe: reuse the week's branch if it already exists.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          git add "$FACTS"
          if git diff --cached --quiet; then
            echo "Facts unchanged — nothing to commit."
          else
            git commit -m "chore: weekly study facts $LABEL"
            git push -u origin "$BRANCH"
          fi

          # Open a draft PR only if one isn't already open for this branch.
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)"
          if [ -z "$EXISTING" ]; then
            gh pr create --draft --base main --head "$BRANCH" \
              --title "Weekly log — $LABEL" \
              --body "Auto-generated study facts for **$LABEL**.

          Run \`/journal-logger\` locally to draft the voiced entry, then review and merge.

          _Generated by the Weekly Progress Log workflow. Every number traces to a Supabase row._"
          else
            echo "Draft PR #$EXISTING already open for $BRANCH — updated facts pushed to it."
          fi
